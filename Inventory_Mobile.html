<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Lookup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            padding: 10px;
        }
        
        .header {
            background: #007AFF;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header .updated {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .search-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        #searchInput {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        #searchInput:focus {
            border-color: #007AFF;
        }
        
        .stats {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .inventory-list {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .inventory-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .inventory-item:last-child {
            border-bottom: none;
        }
        
        .inventory-item.hidden {
            display: none;
        }
        
        .product-code {
            font-weight: bold;
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .product-name {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .details {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .quantity {
            background: #007AFF;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .quantity.low {
            background: #FF3B30;
        }
        
        .quantity.medium {
            background: #FF9500;
        }
        
        .location {
            background: #E8E8E8;
            color: #333;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .inventory-item.zero-retired {
            border-left: 4px solid #c0392b;
            background: #fff0f0;
        }

        .inventory-item.zero-retired .product-code,
        .inventory-item.zero-retired .product-name {
            color: #c0392b;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            display: none;
        }
        
        .no-results.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 Inventory Lookup</h1>
        <div class="updated">Updated: May 12, 2026 at 03:11 PM</div>
    </div>
    
    <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search by code, name, or location..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    
    <div class="stats">
        <span id="resultCount">0</span> items
    </div>
    
    <div class="inventory-list" id="inventoryList">

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

                        























    </div>
    
    <div class="no-results" id="noResults">
        No items found
    </div>
    
    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const inventoryItems = document.querySelectorAll('.inventory-item');
            const resultCount = document.getElementById('resultCount');
            const noResults = document.getElementById('noResults');
            const totalItems = inventoryItems.length;
            
            function performSearch() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                let visibleCount = 0;
                
                inventoryItems.forEach(function(item) {
                    const searchData = item.getAttribute('data-search');
                    if (searchData.includes(searchTerm)) {
                        item.classList.remove('hidden');
                        visibleCount++;
                    } else {
                        item.classList.add('hidden');
                    }
                });
                
                resultCount.textContent = visibleCount;
                
                if (visibleCount === 0) {
                    noResults.classList.add('show');
                } else {
                    noResults.classList.remove('show');
                }
            }
            
            // Use older event handler syntax for better mobile compatibility
            searchInput.oninput = performSearch;
            searchInput.onkeyup = performSearch;
            searchInput.onchange = performSearch;
            searchInput.onsearch = performSearch;
        });
    </script>
</body>
</html>
